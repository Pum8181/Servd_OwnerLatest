name: Deploy to GitHub Pages

# This exact same workflow file is pushed to BOTH the ServdClient and
# ServdOwner repos. It figures out which single page to build from the
# repo's own name, so one file works for both without hand-editing per
# repo:
#   - repo "ServdOwner"  → builds owner_v3.html only
#   - anything else (ServdClient, etc.) → builds index_v3.html
# Result:
#   ServdClient → https://<you>.github.io/ServdClient/
#   ServdOwner  → https://<you>.github.io/ServdOwner/
# (both also reachable at their original /index_v3.html or /owner_v3.html
# path — this workflow additionally copies that file to index.html so
# the bare repo URL with no filename works too.)
#
# marketing.html is NOT part of this workflow — it's hosted separately
# on Netlify at servd.tech (see netlify.toml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: servd-v3/package-lock.json

      - name: Install dependencies
        working-directory: servd-v3
        run: npm ci

      - name: Determine build target from repo name
        id: target
        run: |
          if [ "${{ github.event.repository.name }}" = "ServdOwner" ]; then
            echo "target=owner" >> "$GITHUB_OUTPUT"
            echo "entry=owner_v3.html" >> "$GITHUB_OUTPUT"
          else
            echo "target=customer" >> "$GITHUB_OUTPUT"
            echo "entry=index_v3.html" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: servd-v3
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          BUILD_TARGET: ${{ steps.target.outputs.target }}
        run: npm run build

      - name: Also serve at the bare repo root (no filename needed)
        working-directory: servd-v3
        run: cp "dist/${{ steps.target.outputs.entry }}" dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: servd-v3/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
