name: Deploy to GitHub Pages

# This exact same workflow file is pushed to both the customer-facing
# repo and the owner-dashboard repo. It figures out which single page
# to build from the repo's own name — any repo name containing "owner"
# (case-insensitive, e.g. Servd_OwnerLatest, Servd-Main, ServdOwner)
# builds owner_v3.html; anything else builds index_v3.html. This means
# a future rename doesn't need this file edited again.
#
# Publishes to the `gh-pages` branch (classic method) rather than
# GitHub's newer Actions-native Pages integration — that integration
# repeatedly got stuck serving the raw repo tree instead of this
# workflow's build output. Publishing to a real branch and pointing
# Pages at "Deploy from a branch: gh-pages" sidesteps that entirely.
#
# After this workflow runs once, go to each repo's Settings → Pages →
# Source: "Deploy from a branch" → Branch: gh-pages, folder "/ (root)".
#
# marketing.html is NOT part of this workflow — it's hosted separately
# on Netlify at servd.tech (see netlify.toml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: servd-v3/package-lock.json

      - name: Install dependencies
        working-directory: servd-v3
        run: npm ci

      - name: Determine build target from repo name
        id: target
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          if echo "$REPO_NAME" | grep -qi "owner"; then
            echo "target=owner" >> "$GITHUB_OUTPUT"
            echo "entry=owner_v3.html" >> "$GITHUB_OUTPUT"
          else
            echo "target=customer" >> "$GITHUB_OUTPUT"
            echo "entry=index_v3.html" >> "$GITHUB_OUTPUT"
          fi
          echo "Repo: $REPO_NAME"

      - name: Build
        working-directory: servd-v3
        env:
          BASE_PATH: /${{ steps.target.outputs.repo_name }}/
          BUILD_TARGET: ${{ steps.target.outputs.target }}
        run: npm run build

      - name: Also serve at the bare repo root (no filename needed)
        working-directory: servd-v3
        run: |
          cp "dist/${{ steps.target.outputs.entry }}" dist/index.html
          touch dist/.nojekyll
          echo "<!-- deployed from commit ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%M:%SZ) -->" >> dist/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: servd-v3/dist
