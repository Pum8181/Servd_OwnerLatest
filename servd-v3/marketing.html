    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "Servd",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "QR ordering system for independent restaurants with a human confirmation step before orders reach the kitchen, per-guest order tracking, and flexible split billing.",
          "offers": {
            "@type": "Offer",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Does Servd take a cut of my sales?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. It's a flat monthly rate, never a percentage of what you ring in." }
            },
            {
              "@type": "Question",
              "name": "What happens if I don't confirm an order?",
              "acceptedAnswer": { "@type": "Answer", "text": "It simply sits in Needs Review. Nothing reaches the kitchen until a staff member taps Approve." }
            },
            {
              "@type": "Question",
              "name": "Do my guests need to download an app?",
              "acceptedAnswer": { "@type": "Answer", "text": "No. The QR opens the menu directly in their phone's browser." }
            },
            {
              "@type": "Question",
              "name": "Can I run this on my existing tablet or do I need new hardware?",
              "acceptedAnswer": { "@type": "Answer", "text": "Any modern tablet or laptop with a browser works for the owner dashboard — no special hardware or POS integration required." }
            }
          ]
        }
      ]
    }
    </script>
